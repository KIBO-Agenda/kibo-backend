services:
  evolution-api:
    image: atendai/evolution-api:latest
    network_mode: host
    environment:
      AUTHENTICATION_API_KEY: kibo-dev-key
      SESSION_CLIENT: NOWEB
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:root@localhost:5432/evolution?schema=public
      DATABASE_CONNECTION_URI: postgresql://postgres:root@localhost:5432/evolution?schema=public
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1035692802
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    volumes:
      - ./instances:/evolution/instances:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
